<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajilo Drop - Shared Clipboard</title>
    <meta name="description" content="Real-time shared clipboard with optional encrypted secret messages.">
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">

    <!--
        Apply the saved theme before the page renders to avoid a flash
        of the wrong theme. This must run in <head>, not at the bottom.
    -->
    <script>
        (function () {
            var saved = localStorage.getItem('theme') || 'system';
            if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else if (saved === 'dark') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                // System mode: check the OS preference
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (!prefersDark) {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            }
        })();
    </script>
</head>
<body>
<div class="site-toolbar">
<!-- Sajilo Drop Logo -->
<div class="site-logo">
    <a href="{% url 'index' %}" title="Refresh page">
        <img class="logo-base" src="{% static 'logo.png' %}" alt="Sajilo Drop">
        <img class="logo-dark-text" src="{% static 'logo.png' %}" alt="" aria-hidden="true">
    </a>
</div>

    <!-- =====================================================
         Theme switcher aligned with the logo.
         Click to cycle: System → Light → Dark → System.
         ===================================================== -->
    <div class="theme-switcher" role="group" aria-label="Color theme">
        <button class="theme-cycle-btn" id="themeCycleBtn"
                onclick="cycleTheme()" title="Change theme">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
            </svg>
            <span id="themeText">System</span>
        </button>
    </div>


</div>

    <!-- =====================================================
         Page header
         ===================================================== -->
    <header class="page-header">
    <h1>Share Text <span>Securely</span></h1>
    <p>Real-time shared clipboard: type here, see it everywhere.</p>
</header>


    <!-- =====================================================
         Main card
         ===================================================== -->
    <div class="card">

        <!-- Card top row: section title + live indicator -->
        <div class="flex-row space-between" style="margin-bottom: 0.75rem;">
            <span class="label" style="margin-bottom: 0;">Shared text</span>
            <span class="flex-row" style="gap: 0.4rem;">
                <span class="live-dot"></span>
                <span class="hint">live sync</span>
            </span>
        </div>

        <!-- Shared text form (auto-saves on change, polled every 1 s) -->
        <form id="myForm" action="{% url 'upload' %}" method="post">
            {% csrf_token %}
            <textarea
                name="content"
                id="textarea"
                onchange="changed()"
                placeholder="Start typing…">{{ obj.content }}</textarea>
        </form>

        <div class="gap-sm"></div>

        <!-- Arrow button: copy shared text down into the secret box -->
        <button type="button" class="btn-ghost btn-transfer" onclick="copyToInput()">
            <span class="transfer-arrow" aria-hidden="true">&#8595;</span>
            <span>Copy down to secret box</span>
        </button>

        <div class="divider"></div>

        <!-- Toggle button that shows / hides the secret panel -->
        <button type="button" class="btn-ghost" id="toggleSecretBtn" onclick="toggleSecretBox()" style="width: 100%;">
            &#128274; Secret message
        </button>


        <!-- =====================================================
             Secret panel (hidden until the button above is clicked)
             ===================================================== -->
        <div id="secretContainer">



            <!-- Small section header inside the secret panel -->
            <div class="secret-panel-header">
                <!-- Lock icon (inline SVG so it inherits the current text color) -->
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>Encrypt / Decrypt</span>
            </div>

            <div class="secret-fields">
                <div>
                    <label class="label" for="secretInput">Input</label>
                    <textarea id="secretInput" placeholder="Message to encrypt, or ciphertext to decrypt…"></textarea>
                </div>

                <div>
                    <label class="label" for="passkey">Passkey</label>
                    <form onsubmit="return false;">
                        <input type="text" id="passkey" name="passkey"
                               autocomplete="off" placeholder="8–15 characters">
                    </form>
                </div>

                <div class="secret-actions">
                    <button type="button" class="btn-primary" onclick="encryptMessage()">Encrypt</button>
                    <button type="button" class="btn-ghost" onclick="decryptMessage()">Decrypt</button>
                </div>

                <div id="error" role="alert"></div>

                <div>
                    <label class="label" for="output">Output</label>
                    <textarea id="output" readonly placeholder="Result will appear here…"></textarea>
                </div>

                <button type="button" class="btn-ghost btn-transfer" onclick="copyToSharedText()">
                    <span class="transfer-arrow" aria-hidden="true">&#8593;</span>
                    <span>Push output up to shared text</span>
                </button>
            </div>
        </div>
    </div>

    <script>

    /* ==========================================================
       1. Theme switcher
       ==========================================================

       Three modes:
         "light"  - always use the light palette
         "dark"   - always use the dark palette
         "system" - automatically follow the OS preference

       Click the single button to cycle:
       System → Light → Dark → System

       The choice is saved to localStorage so it persists across
       page reloads.
    ========================================================== */

    var themes = ['system', 'light', 'dark'];

    function setTheme(mode) {
        localStorage.setItem('theme', mode);
        applyTheme(mode);
        updateThemeButton(mode);
    }


    function applyTheme(mode) {
        var html = document.documentElement;

        if (mode === 'light') {
            html.setAttribute('data-theme', 'light');

        } else if (mode === 'dark') {
            html.removeAttribute('data-theme');

        } else {
            // System mode: check the current OS color scheme preference
            var prefersDark =
                window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (prefersDark) {
                html.removeAttribute('data-theme');
            } else {
                html.setAttribute('data-theme', 'light');
            }
        }
    }


    // Cycle: System → Light → Dark → System
    function cycleTheme() {
        var current = localStorage.getItem('theme') || 'system';
        var currentIndex = themes.indexOf(current);
        var nextIndex = (currentIndex + 1) % themes.length;

        setTheme(themes[nextIndex]);
    }


    // Update the icon and text of the single theme button
    function updateThemeButton(mode) {
        var icon = document.getElementById('themeIcon');
        var text = document.getElementById('themeText');

        if (mode === 'light') {

            text.textContent = 'Light';

            icon.innerHTML = `
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            `;

        } else if (mode === 'dark') {

            text.textContent = 'Dark';

            icon.innerHTML = `
                <path d="M21 12.79A9 9 0 1 1 11.21 3
                         7 7 0 0 0 21 12.79z"></path>
            `;

        } else {

            text.textContent = 'System';

            icon.innerHTML = `
                <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            `;
        }
    }


    // On page load: restore the saved theme
    (function () {
        var saved = localStorage.getItem('theme') || 'system';

        applyTheme(saved);
        updateThemeButton(saved);
    })();


    // If System mode is selected, follow OS-level theme changes
    window.matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', function () {

            var current =
                localStorage.getItem('theme') || 'system';

            if (current === 'system') {
                applyTheme('system');
                updateThemeButton('system');
            }
        });


    /* ==========================================================
       2. Shared text - sync with the server
       ==========================================================

       changed()   - called whenever the user edits the textarea.
                     POSTs the new content and updates the field
                     with what the server saved (resolves conflicts).

       setInterval - polls the server every second while the
                     textarea is not focused, so changes made by
                     other users appear automatically.
    ========================================================== */

    function changed() {
        var form = document.getElementById("myForm");

        fetch(form.action, {
            method: "POST",
            headers: {
                "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: new URLSearchParams(new FormData(form))
        })
        .then(response => response.json())
        .then(data => {
            console.log("Shared data:", data);
            attempts = 0;
            value = 5000;
            return data;
        })
        .then(data => document.getElementById('textarea').value = data.content)
        .catch(error => console.error("Error:", error));
    }

    let value = 5000;
    let attempts = 0;

    function attempt() {
        attempts++;

        if (attempts > 5) {
            value = 20000;
        } else {
            value = 5000;
        }

        return value;
    }

    function getContent() {
        const myInput = document.getElementById('textarea');
        const isFocused = (document.activeElement === myInput);

        if (isFocused) {
        }
        else {
            fetch('{% url "content" %}', {
                method: "GET",
            })
            .then(response => response.json())
            .then(data => {
                console.log("Shared data:", data);
                return data;
            })
            .then(data => document.getElementById('textarea').value = data.content)
            .catch(error => console.error("Error:", error));
        }

        // Dynamic polling: schedules the next check using attempt()
        setTimeout(getContent, attempt());
    }

    // Initial trigger
    setTimeout(getContent, attempt());


    /* ==========================================================
       3. Secret panel - show / hide and copy helpers
    ========================================================== */

    var secretOpen = false;

    function toggleSecretBox() {
        secretOpen = !secretOpen;
        var container = document.getElementById("secretContainer");
        var btn       = document.getElementById("toggleSecretBtn");

        if (secretOpen) {
            container.classList.add("open");
            btn.textContent = "\u2715 Close secret box";
        } else {
            container.classList.remove("open");
            btn.innerHTML = "&#128274; Secret message";
        }
    }

    // Copy the shared textarea content into the secret input
    function copyToInput() {
        document.getElementById("secretInput").value =
            document.getElementById("textarea").value;
    }

    // Copy the secret output back into the shared textarea and save it
    function copyToSharedText() {
        document.getElementById("textarea").value =
            document.getElementById("output").value;
        changed();
    }


    /*
        AES-GCM
    */

    class AESGCM {
        static ALGORITHM = "AES-GCM";
        static HASH = "SHA-256";
        static KEY_SIZE = 256;
        static ITERATION_COUNT = 100000;
        static MIN_KEY_LENGTH = 8;
        static MAX_KEY_LENGTH = 15;

        constructor() {
            this.textEncoder = new TextEncoder();
            this.textDecoder = new TextDecoder();
        }

        // Make sure the passkey meets the length requirement
        validateKey(key) {
            if (typeof key !== "string")
                throw new Error("Passkey must be a string.");
            if (key.length < AESGCM.MIN_KEY_LENGTH || key.length > AESGCM.MAX_KEY_LENGTH)
                throw new Error(
                    "Passkey must be " + AESGCM.MIN_KEY_LENGTH + "-" + AESGCM.MAX_KEY_LENGTH + " characters long."
                );
        }

        async generateKeyMaterial(password) {
            return crypto.subtle.importKey(
                "raw",
                this.textEncoder.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveBits", "deriveKey"]
            );
        }

        async generateKey(keyMaterial, salt) {
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: AESGCM.ITERATION_COUNT, hash: AESGCM.HASH },
                keyMaterial,
                { name: AESGCM.ALGORITHM, length: AESGCM.KEY_SIZE },
                true,
                ["encrypt", "decrypt"]
            );
        }

        async encrypt(plaintext, key) {
            this.validateKey(key);
            const data = this.textEncoder.encode(plaintext);
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const keyMaterial = await this.generateKeyMaterial(key);
            const derivedKey = await this.generateKey(keyMaterial, salt);
            const iv = crypto.getRandomValues(new Uint8Array(12));

            const encryptedData = await crypto.subtle.encrypt(
                { name: AESGCM.ALGORITHM, iv: iv },
                derivedKey,
                data
            );

            const ciphertextBase64 = btoa(String.fromCharCode.apply(null, new Uint8Array(encryptedData)));
            const ivBase64 = btoa(String.fromCharCode.apply(null, iv));
            const saltBase64 = btoa(String.fromCharCode.apply(null, salt));

            return ciphertextBase64 + ":" + ivBase64 + ":" + saltBase64;
        }

        async decrypt(encryptedData, key) {
            this.validateKey(key);
            const parts = encryptedData.split(":");
            if (parts.length !== 3) {
                throw new Error("Invalid encrypted message format.");
            }
            const [ciphertextStr, ivStr, saltStr] = parts;

            const ciphertext = Uint8Array.from(atob(ciphertextStr), c => c.charCodeAt(0));
            const iv = Uint8Array.from(atob(ivStr), c => c.charCodeAt(0));
            const salt = Uint8Array.from(atob(saltStr), c => c.charCodeAt(0));

            const keyMaterial = await this.generateKeyMaterial(key);
            const derivedKey = await this.generateKey(keyMaterial, salt);

            const decryptedData = await crypto.subtle.decrypt(
                { name: AESGCM.ALGORITHM, iv: iv },
                derivedKey,
                ciphertext
            );

            return this.textDecoder.decode(decryptedData);
        }
    }

    var cipher = new AESGCM();

    // Live indicator: green normally, red on encryption/decryption errors
    function setLiveGreen() {
        var dot = document.querySelector('.live-dot');
        if (dot) dot.classList.remove('encryption-error');
    }

    function setLiveRed() {
        var dot = document.querySelector('.live-dot');
        if (dot) dot.classList.add('encryption-error');
    }

    async function encryptMessage() {
        var input   = document.getElementById("secretInput").value;
        var passkey = document.getElementById("passkey").value;
        var output  = document.getElementById("output");
        var error   = document.getElementById("error");

        error.textContent = "";
        output.value      = "";

        if (!input.trim()) {
            error.textContent = "Please enter a message.";
            setLiveRed();
            return;
        }

        if (!passkey) {
            error.textContent = "Please enter a passkey.";
            setLiveRed();
            return;
        }

        try {
            output.value = await cipher.encrypt(input, passkey);
            setLiveGreen();
        } catch (err) {
            error.textContent = "Error: " + err.message;
            setLiveRed();
        }
    }

    async function decryptMessage() {
        var input   = document.getElementById("secretInput").value;
        var passkey = document.getElementById("passkey").value;
        var output  = document.getElementById("output");
        var error   = document.getElementById("error");

        error.textContent = "";
        output.value      = "";

        if (!input.trim()) {
            error.textContent = "Please enter encrypted text.";
            setLiveRed();
            return;
        }

        if (!passkey) {
            error.textContent = "Please enter a passkey.";
            setLiveRed();
            return;
        }

        try {
            output.value = await cipher.decrypt(input, passkey);
            setLiveGreen();
        } catch (err) {
            error.textContent = "Unable to decrypt - check the ciphertext and passkey.";
            setLiveRed();
        }
    }

    </script>
</body>
</html>
