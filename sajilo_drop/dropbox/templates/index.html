<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Message</title>
    <style>
        textarea { width: 400px; height: 100px; }
        #secretContainer { display: none; margin-top: 20px; }
    </style>
</head>
<body>

    <form id="myForm" action="{% url 'upload' %}" method="post">
        {% csrf_token %}
        <textarea name="content" id="textarea" onchange="changed()">{{ obj.content }}</textarea>
    </form>

    <button type="button" onclick="copyToInput()">&#8595;</button>

    <br><br>

    <button type="button" onclick="openSecretBox()">Secret Message</button>

    <div id="secretContainer">

        <div>
            <label for="secretInput">Input</label><br>
            <textarea id="secretInput"></textarea>
        </div>

        <div>
            <label for="output">Output</label><br>
            <textarea id="output" readonly></textarea>
        </div>

        <button type="button" onclick="copyToSharedText()">&#8593;</button>

        <br><br>

        <form onsubmit="return false;">
            <label for="passkey">Passkey</label><br>
            <input type="text" id="passkey" name="passkey" autocomplete="off" placeholder="8-15 characters">
        </form>

        <br>

        <button type="button" onclick="encryptMessage()">Encrypt</button>
        <button type="button" onclick="decryptMessage()">Decrypt</button>

        <div id="error" style="color:red;"></div>

    </div>

    <script>

    /*
        Shared text form submit / sync
    */

    function changed() {
        const form = document.getElementById("myForm");

        fetch(form.action, {
            method: "POST",
            headers: {
                "X-CSRFToken": document.querySelector(
                    '[name=csrfmiddlewaretoken]'
                ).value
            },
            body: new URLSearchParams(new FormData(form))
        })
        .then(response => response.json())
        .then(data => document.getElementById('textarea').value = data.content)
        .catch(error => console.error("Error:", error));
    }

    setInterval(function() {
        const myInput = document.getElementById('textarea');
        const isFocused = (document.activeElement === myInput);

        if (isFocused) {
        }
        else {
            fetch('{% url "content" %}', {
                method: "GET",
            })
            .then(response => response.json())
            .then(data => {
            console.log("Shared data:", data);
            return data;
            })
            .then(data => document.getElementById('textarea').value = data.content)
            .catch(error => console.error("Error:", error));
        }
    }, 1000);


    /* Secret message box */

    function openSecretBox() {
        document.getElementById("secretContainer").style.display = "block";
    }

    function copyToInput() {
        document.getElementById("secretInput").value =
            document.getElementById("textarea").value;
    }

    function copyToSharedText() {
        document.getElementById("textarea").value =
            document.getElementById("output").value;
        changed();
    }


    /* XOR cipher (repeating-key), mirrors the Python reference implementation */

    class AESGCM {
        static MIN_KEY_LENGTH = 8;
        static MAX_KEY_LENGTH = 15;

        constructor() {
            this.textEncoder = new TextEncoder();
            this.textDecoder = new TextDecoder();
        }

        validateKey(key) {
            if (typeof key !== "string") {
                throw new Error("Key must be a string.");
            }
            if (key.length < AESGCM.MIN_KEY_LENGTH || key.length > AESGCM.MAX_KEY_LENGTH) {
                throw new Error(`Key must be between ${AESGCM.MIN_KEY_LENGTH} and ${AESGCM.MAX_KEY_LENGTH} characters long.`);
            }
        }

        // XOR each message byte with the corresponding key byte, repeating
        // the key (passkey) to cover the full message length, since here
        // the passkey is shorter than the message rather than equal to it.
        xorBytes(dataBytes, keyBytes) {
            const out = new Uint8Array(dataBytes.length);
            for (let i = 0; i < dataBytes.length; i++) {
                out[i] = dataBytes[i] ^ keyBytes[i % keyBytes.length];
            }
            return out;
        }

        async encrypt(plaintext, key) {
            this.validateKey(key);
            const data = this.textEncoder.encode(plaintext);
            const keyBytes = this.textEncoder.encode(key);

            const ciphertext = this.xorBytes(data, keyBytes);

            return btoa(String.fromCharCode.apply(null, ciphertext));
        }

        async decrypt(encryptedData, key) {
            this.validateKey(key);
            const keyBytes = this.textEncoder.encode(key);

            const ciphertext = Uint8Array.from(atob(encryptedData), c => c.charCodeAt(0));
            const plaintextBytes = this.xorBytes(ciphertext, keyBytes);

            return this.textDecoder.decode(plaintextBytes);
        }
    }

    const aesGcm = new AESGCM();

    async function encryptMessage() {
        const input = document.getElementById("secretInput").value;
        const passkey = document.getElementById("passkey").value;
        const output = document.getElementById("output");
        const error = document.getElementById("error");

        error.textContent = "";
        output.value = "";

        if (!input.trim()) { error.textContent = "Please enter a message."; return; }
        if (!passkey) { error.textContent = "Please enter a passkey."; return; }

        try {
            output.value = await aesGcm.encrypt(input, passkey);
        } catch (err) {
            error.textContent = "Error: " + err.message;
        }
    }

    async function decryptMessage() {
        const input = document.getElementById("secretInput").value;
        const passkey = document.getElementById("passkey").value;
        const output = document.getElementById("output");
        const error = document.getElementById("error");

        error.textContent = "";
        output.value = "";

        if (!input.trim()) { error.textContent = "Please enter encrypted text."; return; }
        if (!passkey) { error.textContent = "Please enter a passkey."; return; }

        try {
            output.value = await aesGcm.decrypt(input, passkey);
        } catch (err) {
            error.textContent = "Unable to decrypt. Check the encrypted text and passkey.";
        }
    }

    </script>
</body>
</html>
